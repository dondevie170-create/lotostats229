name: Mise a jour LotoStats229

on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "25 23 * * *"
    - cron: "40 23 * * *"
    - cron: "10 7 * * *"
    - cron: "25 7 * * *"
    - cron: "40 7 * * *"
    - cron: "10 10 * * *"
    - cron: "25 10 * * *"
    - cron: "40 10 * * *"
    - cron: "10 13 * * *"
    - cron: "25 13 * * *"
    - cron: "40 13 * * *"
    - cron: "10 17 * * *"
    - cron: "25 17 * * *"
    - cron: "40 17 * * *"
    - cron: "10 19 * * *"
    - cron: "25 19 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Recuperer les nouveaux tirages
        id: scrape
        run: python scripts/scraper.py

      - name: Calculer les tendances
        if: steps.scrape.outputs.added != '0'
        run: python scripts/analyze.py

      - name: Generer le site
        if: steps.scrape.outputs.added != '0'
        run: python scripts/generate_site.py

      - name: Publier sur Telegram
        if: steps.scrape.outputs.added != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_post.py

      - name: Commiter les changements
        if: steps.scrape.outputs.added != '0'
        run: |
          git config user.name "LotoStats229 Bot"
          git config user.email "bot@lotostats229.local"
          git add data/ docs/
          git diff --quiet --cached || git commit -m "Mise a jour automatique des tendances"
          git push
